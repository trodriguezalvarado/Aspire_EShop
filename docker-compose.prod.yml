services:
  sql-server:
    volumes:
      - ./sql-data:/var/opt/mssql/data
    restart: always
    deploy:
      resources:
        limits:
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    volumes:
      - ./redis-data:/data
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  rabbitmq:
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  keycloak:
    volumes:
      - ./keycloak-data:/opt/keycloak/data
      - ./tienda-realm-export.json:/opt/keycloak/data/import/realm.json:ro
    restart: always
    deploy:
      resources:
        limits:
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "8081:8080"
    environment:
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN_USER}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - KC_HOSTNAME=${KC_HOSTNAME}
      - KC_HTTP_RELATIVE_PATH=${KC_HTTP_RELATIVE_PATH}
      - KC_PROXY_HEADERS=xforwarded
      - KC_HOSTNAME_STRICT=${KC_HOSTNAME_STRICT}
      - KC_HTTP_ENABLED=true
      - KC_HOSTNAME_STRICT_HTTPS=${KC_HOSTNAME_STRICT_HTTPS}

  admin-dashboard:
    build:
      args:
        - BASE_HREF=/admin/
        - CONFIGURATION=production
    environment:
      - KEYCLOAK_URL=${KEYCLOAK_URL}
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  tienda-web:
    restart: always
    volumes:
      - dataprotection_keys:/root/.aspnet/DataProtection-Keys
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  tienda-web-dapr:
    command: ["./daprd", "--app-id", "webfrontend", "--app-port", "80", "--app-channel-address", "tienda-web", "--dapr-http-port", "3500", "--resources-path", "/components"]
    depends_on:
      tienda-web:
        condition: service_started
    # --- CLEAN HOOK: Mounts your templates directory so the folder isn't blank ---
    volumes:
      - ./dapr/components-templates:/components:ro
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    restart: always

  gateway-nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./TiendaAspire.admin-dashBoard/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - admin-dashboard
      - tienda-web
    restart: always

  inventario-api:
    restart: always
    volumes:
      - dataprotection_keys:/root/.aspnet/DataProtection-Keys
    extra_hosts:
      - "${HOSTNAME}:host-gateway"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  inventario-api-dapr:
    command: ["./daprd", "--app-id", "inventarioservice", "--app-port", "80", "--app-channel-address", "inventario-api", "--dapr-http-port", "3500", "--dapr-grpc-port", "50001", "--resources-path", "/components"]
    extra_hosts:
      - "${HOSTNAME}:host-gateway"
    volumes:
      # --- Pure volume mount of the static template folder ---
      - ./dapr/components-prod:/components:ro
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    restart: always

  catalogo-api:
    restart: always
    volumes:
      - dataprotection_keys:/root/.aspnet/DataProtection-Keys
    extra_hosts:
      - "${HOSTNAME}:host-gateway"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  catalogo-api-dapr:
    command: ["./daprd", "--app-id", "catalogoservice", "--app-port", "80", "--app-channel-address", "catalogo-api", "--dapr-http-port", "3500", "--dapr-grpc-port", "50001", "--resources-path", "/components"]
    extra_hosts:
      - "${HOSTNAME}:host-gateway"    
    volumes:
      # --- Pure volume mount of the static template folder ---
      - ./dapr/components-prod:/components:ro
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    restart: always

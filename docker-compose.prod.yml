services:
  # 1. Close internal ports by removing the port mapping
  sql-server:
    volumes:
      - ./sql-data:/var/opt/mssql/data # Maps SQL data to a local folder  
    restart: always
    deploy:
      resources:
        limits:
          memory: 2G  # SQL needs more RAM
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    volumes:
      - ./redis-data:/data # Maps Redis cache/state  
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M  # Redis es muy eficiente, con 256MB suele sobrar para cache
        reservations:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  rabbitmq:
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G    # RabbitMQ necesita mas RAM para el panel de gestion y las colas
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  keycloak:
    volumes:
      - ./keycloak-data:/opt/keycloak/data # Maps Keycloak users/settings
      - ./tienda-realm-export.json:/opt/keycloak/data/import/realm.json:ro  
    restart: always
    deploy:
      resources:
        limits:
          memory: 2G  # SQL needs more RAM
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "8081:8080" # Still needed for the browser login
    environment:
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN_USER}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - KC_HOSTNAME=${KC_HOSTNAME}
      - KC_HTTP_RELATIVE_PATH=${KC_HTTP_RELATIVE_PATH}
      - KC_PROXY_HEADERS=xforwarded
      - KC_HOSTNAME_STRICT=${KC_HOSTNAME_STRICT}
      - KC_HTTP_ENABLED=true
      - KC_HOSTNAME_STRICT_HTTPS=${KC_HOSTNAME_STRICT_HTTPS}
  # 2. Map Dashboard and Web to standard ports (80/443)
  admin-dashboard:
    build:
      args:
        - BASE_HREF=/admin/ # This overrides the default for production     
        - CONFIGURATION=production 
    environment:
      # Pasamos la variable del .env al contenedor
      - KEYCLOAK_URL=${KEYCLOAK_URL}
    restart: always
    # --- Resource Limits ---
    deploy:
      resources:
        limits:
          cpus: '0.50'     # Limit to 50% of 1 CPU core
          memory: 512M     # Limit to 512MB RAM
        reservations:
          memory: 128M     # Minimum guaranteed RAM
    # --- Log Rotation ---
    logging:
      driver: "json-file"
      options:
        max-size: "10m"    # Maximum 10MB per log file
        max-file: "3"      # Keep only the last 3 files

  tienda-web:
    restart: always
    # --- Resource Limits ---
    deploy:
      resources:
        limits:
          cpus: '0.50'     # Limit to 50% of 1 CPU core
          memory: 512M     # Limit to 512MB RAM
        reservations:
          memory: 128M     # Minimum guaranteed RAM
    # --- Log Rotation ---
    logging:
      driver: "json-file"
      options:
        max-size: "10m"    # Maximum 10MB per log file
        max-file: "3"      # Keep only the last 3 files

  tienda-web-dapr:
    image: "daprio/daprd:1.14.4"
    command: ["./daprd", "--app-id", "webfrontend", "--app-port", "80", "--app-channel-address", "tienda-web", "--dapr-http-port", "3500", "--resources-path", "/components"]
    depends_on:
      tienda-web:
        condition: service_started
    volumes:
      - ./dapr/components-prod:/components:ro
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    restart: always
  
  # Creamos un servicio NGINX dedicado como UNICO punto de entrada
  gateway-nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./TiendaAspire.admin-dashBoard/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - admin-dashboard
      - tienda-web
    restart: always
 

  # 3. Ensure APIs restart if the server reboots
  inventario-api:
    restart: always
    # --- Resource Limits ---
    deploy:
      resources:
        limits:
          cpus: '0.50'     # Limit to 50% of 1 CPU core
          memory: 512M     # Limit to 512MB RAM
        reservations:
          memory: 128M     # Minimum guaranteed RAM
    # --- Log Rotation ---
    logging:
      driver: "json-file"
      options:
        max-size: "10m"    # Maximum 10MB per log file
        max-file: "3"      # Keep only the last 3 files

  inventario-api-dapr:
    image: "daprio/daprd:1.14.4"
    command: ["./daprd", "--app-id", "inventarioservice", "--app-port", "80", "--app-channel-address", "inventario-api", "--dapr-http-port", "3500", "--dapr-grpc-port", "50001", "--resources-path", "/components"]
    # --- ENVIRONMENT EXTRACTION CONTROL ---
    # This safely bridges your host .env secrets straight into Dapr's template engine
    environment:
      - PROD_RABBITMQ_USER=${RABBITMQ_DEFAULT_USER}
      - PROD_RABBITMQ_PASSWORD=${RABBITMQ_DEFAULT_PASS}
    depends_on:
      rabbitmq:
        condition: service_healthy # Sidecar waits until RabbitMQ is 100% up
      inventario-api:
        condition: service_started
    volumes:
      - ./dapr/components-prod:/components:ro
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    restart: always
  
  catalogo-api:
    restart: always
    # --- Resource Limits ---
    deploy:
      resources:
        limits:
          cpus: '0.50'     # Limit to 50% of 1 CPU core
          memory: 512M     # Limit to 512MB RAM
        reservations:
          memory: 128M     # Minimum guaranteed RAM
    # --- Log Rotation ---
    logging:
      driver: "json-file"
      options:
        max-size: "10m"    # Maximum 10MB per log file
        max-file: "3"      # Keep only the last 3 files

  catalogo-api-dapr:
    image: "daprio/daprd:1.14.4"
    command: ["./daprd", "--app-id", "catalogoservice", "--app-port", "80", "--app-channel-address", "catalogo-api", "--dapr-http-port", "3500", "--dapr-grpc-port", "50001", "--resources-path", "/components"]
    environment:
      - PROD_RABBITMQ_USER=${RABBITMQ_DEFAULT_USER}
      - PROD_RABBITMQ_PASSWORD=${RABBITMQ_DEFAULT_PASS}
      - PROD_REDIS_PASSWORD=${REDIS_STATIC_PASSWORD}
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      catalogo-api:
        condition: service_started
    volumes:
      - ./dapr/components-prod:/components:ro
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    restart: always

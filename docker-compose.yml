services:
  # --- COMMON INFRASTRUCTURE SERVICES ---
  sql-server:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${SQL_SA_PASSWORD}
    volumes:
      - sql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'T34m0W2kRalperios*' -Q 'SELECT 1' -C"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics check_running && rabbitmq-diagnostics check_local_alarms"]
      interval: 5s
      timeout: 5s
      retries: 6

  keycloak:
    image: keycloak/keycloak:26.0
    command:
      - start-dev
      - --import-realm
    environment:
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN_USER}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - KC_HOSTNAME_STRICT=false
      - KC_HTTP_ENABLED=true
      - KC_PROXY_HEADERS=xforwarded
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./tienda-realm-export.json:/opt/keycloak/data/import/realm.json:ro

  # --- MICROSERVICES SERVICES & SIDECARS ---
  inventario-api:
    build:
      context: .
      dockerfile: InventarioService/Dockerfile
    depends_on:
      sql-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      - ConnectionStrings__inventorydb=${CONNECTION_SQL_INVENTARIO}
      - Aspire__RabbitMQ__Client__ConnectionString=${CONNECTION_RABBITMQ}
      - Authentication__Schemes__Bearer__Authority=${Authentication__Schemes__Bearer__Authority}
      - DOTNET_SYSTEM_NET_HTTP_SOCKETSHTTPHANDLER_HTTP2UNENCRYPTEDSUPPORT=true
      - DAPR_HTTP_PORT=3500
      - DAPR_GRPC_PORT=50001
      - DAPR_GRPC_ENDPOINT=http://inventario-api-dapr:50001
      - ASPNETCORE_HTTP_PORTS=8080
    networks:
      default:
        aliases:
          - inventarioservice

  inventario-api-dapr:
    image: "daprio/daprd:1.14.4"
    depends_on:
      rabbitmq:
        condition: service_healthy
      inventario-api:
        condition: service_started

  catalogo-api:
    build:
      context: .
      dockerfile: TiendaAspire.ApiService/Dockerfile
    depends_on:
      sql-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - ConnectionStrings__catalogdb=${CONNECTION_SQL_CATALOGO}
      - Aspire__RabbitMQ__Client__ConnectionString=${CONNECTION_RABBITMQ}
      - Authentication__Schemes__Bearer__Authority=${Authentication__Schemes__Bearer__Authority}
      - DOTNET_SYSTEM_NET_HTTP_SOCKETSHTTPHANDLER_HTTP2UNENCRYPTEDSUPPORT=true
      - DAPR_HTTP_PORT=3500
      - DAPR_GRPC_PORT=50001
      - DAPR_GRPC_ENDPOINT=http://catalogo-api-dapr:50001
      - ASPNETCORE_HTTP_PORTS=8080
    networks:
      default:
        aliases:
          - catalogoservice

  catalogo-api-dapr:
    image: "daprio/daprd:1.14.4"
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      catalogo-api:
        condition: service_started

  # --- FRONTENDS MANAGEMENT ---
  admin-dashboard:
    build:
      context: .
      dockerfile: TiendaAspire.admin-dashBoard/Dockerfile
    depends_on:
      catalogo-api:
        condition: service_started
      inventario-api:
        condition: service_started
    environment:
      - KEYCLOAK_URL=${KEYCLOAK_URL}

  tienda-web:
    build:
      context: .
      dockerfile: TiendaAspire.Web/Dockerfile
    environment:
      - DAPR_HTTP_PORT=3500
      - DAPR_HTTP_ENDPOINT=http://tienda-web-dapr:3500
    depends_on:
      - catalogo-api
    volumes:
      - dataprotection_keys:/root/.aspnet/DataProtection-Keys

  tienda-web-dapr:
    image: "daprio/daprd:1.14.4"
    depends_on:
      - tienda-web

# Global Volume Declarations (Fixed Underscores)
volumes:
  keycloak_data:
  sql_data:
  dataprotection_keys:

services:
  sql-server:
    image: mcr.microsoft.com/mssql/server:2022-latest 
    environment:
      - MSSQL_SA_PASSWORD=${SQL_SA_PASSWORD}
  
  redis:
    image: redis:7.4
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management 
    ports:
      - "5672:5672"
      - "15672:15672"

  keycloak:
    networks:
      default:
        aliases:
          - localhost
    ports:
        - "8081:8080"
    environment:
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN_USER}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - KC_HOSTNAME=${KC_HOSTNAME}
      - KC_HTTP_RELATIVE_PATH=${KC_HTTP_RELATIVE_PATH}
      - KC_PROXY_HEADERS=xforwarded
      - KC_HOSTNAME_STRICT=${KC_HOSTNAME_STRICT}
      - KC_HTTP_ENABLED=true
      - KC_HOSTNAME_STRICT_HTTPS=${KC_HOSTNAME_STRICT_HTTPS}
      
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./tienda-realm-export.json:/opt/keycloak/data/import/realm.json:ro

  inventario-api-dapr:
    image: "daprio/daprd:1.14.4"
    command: [
      "./daprd",
      "--app-id", "inventarioservice",
      "--app-port", "80", 
      "--app-channel-address", "inventario-api",
      "--dapr-http-port", "3500",
      "--dapr-grpc-port", "50001",
      "--resources-path", "/components"
    ]
    networks:
      default:
        aliases:
          - inventarioservice-dapr
    volumes:
      # Mount your global dapr components directory right into the sidecar container
      - ~/.dapr/components:/components:ro 
    depends_on:
      rabbitmq:
        condition: service_healthy
      inventario-api:
        condition: service_started

  catalogo-api-dapr:
    image: "daprio/daprd:1.14.4"
    command: [
      "./daprd",
      "--app-id", "catalogoservice",
      "--app-port", "80",
      "--app-channel-address", "catalogo-api",
      "--dapr-http-port", "3500",
      "--dapr-grpc-port", "50001",
      "--resources-path", "/components",
    ]
    networks:
      default:
        aliases:
          - catalogoservice-dapr
    volumes:
      - ~/.dapr/components:/components:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      catalogo-api:
        condition: service_started

  tienda-web-dapr:
    image: "daprio/daprd:1.14.4"
    command: [
      "./daprd",
      "--app-id", "webfrontend",
      "--app-port", "80",
      "--app-channel-address", "tienda-web",
      "--dapr-http-port", "3500",
      "--resources-path", "/components",
    ]
    volumes:
      - ~/.dapr/components:/components:ro
    depends_on:
      tienda-web:
        condition: service_started

  gateway-nginx:
    image: nginx:alpine
    ports:
      - "80:80" 
    networks:
      default:
        aliases:
          - localhost
    volumes:
      - ./TiendaAspire.admin-dashBoard/nginx.localalias.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - admin-dashboard
      - tienda-web
  
  inventario-api:
    extra_hosts:
      - ${HOSTNAME}:host-gateway
 
  catalogo-api:
     extra_hosts:
      - ${HOSTNAME}:host-gateway

  admin-dashboard: 
    build:
      args:
        - BASE_HREF=/admin/
        - CONFIGURATION=development
    environment:
      - KEYCLOAK_URL=${KEYCLOAK_URL}

    
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: statestore
spec:
  type: state.redis
  version: v1
  metadata:
  - name: redisHost
    value: "redis:6379"  
  - name: redisPassword
    value: "{{env:PROD_REDIS_PASSWORD}}" 
  - name: actorStateStore
    value: "true"
  - name: ignoreErrors
    value: "true"	
scopes:
  - catalogoservice
